name: Merge-upstream

on:
  workflow_dispatch:
  schedule:
    - cron: 50 23 * * *

jobs:

  merge:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0
        lfs: true

    - name: Set git identity
      run : |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git config --global pull.rebase false

    - name: Load upstream commits
      run: |
        set -euo pipefail
        git fetch https://github.com/v2fly/domain-list-community.git master

        if git merge FETCH_HEAD --log --no-commit; then
          exit 0
        fi

        # Workflows are maintained by this fork and are excluded from the
        # upstream merge below. Resolve conflicts in that directory locally so
        # they do not abort an otherwise clean upstream sync.
        has_unexpected_conflict=false
        while IFS= read -r conflicted_file; do
          case "$conflicted_file" in
            .github/*) ;;
            *)
              echo "Unresolved upstream conflict: $conflicted_file" >&2
              has_unexpected_conflict=true
              ;;
          esac
        done < <(git diff --name-only --diff-filter=U)

        if [ "$has_unexpected_conflict" = true ]; then
          exit 1
        fi

        git restore --ours --worktree -- .github
        git add .github

    - name: Apply commit changes
      run: |
        if [ -f ./.git/MERGE_MSG ]; then
        mkdir -p ./tmp && cp ./.git/MERGE_MSG ./tmp/message
        sed -i "1c [bot] AutoMerging: merge all upstream's changes:" ./tmp/message
        sed -i '/^\#.*/d' ./tmp/message
        git reset HEAD .github
        git commit --file="./tmp/message"
        else
        echo "There is no merge commits."
        fi

    - name: Push Commits
      env:
        DOWNSTREAM_BRANCH: master
      run: git push https://YW5vbnltb3Vz:${{ secrets.access_token }}@github.com/${{ github.repository }} $DOWNSTREAM_BRANCH

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 1
