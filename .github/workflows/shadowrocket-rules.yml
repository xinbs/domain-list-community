name: Build Shadowrocket Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"  # 每天 00:30 UTC 运行
  push:
    branches:
      - master
    paths:
      - "shadowrocket/**"
      - ".github/workflows/shadowrocket-rules.yml"

permissions:
  contents: write

jobs:
  build-shadowrocket-rules:
    name: Build Shadowrocket Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          path: code
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set variables
        run: |
          echo "RELEASE_NAME=shadowrocket-$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
        shell: bash

      - name: Setup Python environment for Shadowrocket
        run: |
          cd code/shadowrocket
          python -m venv shadowrocket_env
          source shadowrocket_env/bin/activate
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build Shadowrocket rules
        run: |
          cd code/shadowrocket
          source shadowrocket_env/bin/activate
          
          # 运行所有 Shadowrocket 规则生成脚本
          echo "Building GFWList rules..."
          python build_shadowrocket_rules.py
          
          echo "Building GFWList + AD blocking rules..."
          python convert_gfwlist_ad.py
          
          echo "Building China IP bypass rules..."
          python fetch_cn_ip_bypass.py

      - name: Generate file checksums
        run: |
          cd code/shadowrocket/resultant
          for file in *.conf *.config *.list; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256sum"
            fi
          done
          # 为使用说明文件生成校验和（如果存在）
          if [ -f "../使用说明.md" ]; then
            sha256sum "../使用说明.md" > "shadowrocket-usage.md.sha256sum"
          fi

      - name: List generated files
        run: |
          cd code/shadowrocket/resultant
          echo "Generated Shadowrocket rule files:"
          ls -la *.conf *.config *.list *.sha256sum 2>/dev/null || echo "No files found"

      - name: Push to release branch
        run: |
          cd code
          # 配置 Git 用户信息
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 检出或创建 release 分支
          git fetch origin release:release 2>/dev/null || git checkout --orphan release
          git checkout release 2>/dev/null || true
          echo "[DEBUG] 当前分支: $(git branch --show-current)"
          echo "[DEBUG] 仓库根目录: $(pwd)"
          echo "[DEBUG] 列出生成目录内容 (shadowrocket/resultant):"
          ls -la shadowrocket/resultant || true
          
          # 添加 Shadowrocket 相关文件
          echo "[DEBUG] 执行 git add -A shadowrocket/resultant"
          git add -A shadowrocket/resultant || true
          # 添加使用说明文件（如果存在）
          if [ -f "shadowrocket/使用说明.md" ]; then
            git add shadowrocket/使用说明.md
          fi
          if [ -f "shadowrocket/resultant/shadowrocket-usage.md.sha256sum" ]; then
            git add shadowrocket/resultant/shadowrocket-usage.md.sha256sum
          fi
          echo "[DEBUG] 暂存区文件列表:" && git diff --staged --name-only || true
          
          # 检查是否有变更需要提交
          if git diff --staged --quiet; then
            echo "No changes to commit for Shadowrocket rules"
          else
            git commit -m "🚀 Auto-build Shadowrocket rules - ${{ env.BUILD_TIME }}"
            echo "[DEBUG] 推送到远程 release 分支"
            git push origin HEAD:release
          fi

      - name: Create build summary
        run: |
          cd code/shadowrocket/resultant
          echo "## 🎯 Shadowrocket Rules Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** ${{ env.BUILD_TIME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Name:** ${{ env.RELEASE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Generated Files:" >> $GITHUB_STEP_SUMMARY
          for file in *.conf *.config *.list; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              echo "- **$file** (${size} bytes)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Usage Instructions:" >> $GITHUB_STEP_SUMMARY
          echo "Generated files are available in the \`release\` branch for direct import into Shadowrocket." >> $GITHUB_STEP_SUMMARY