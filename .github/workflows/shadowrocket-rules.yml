name: Build Shadowrocket Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"  # 每天 00:30 UTC 运行
  workflow_run:
    workflows: ["Build dlc.dat"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

jobs:
  build-shadowrocket-rules:
    name: Build Shadowrocket Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          path: code
          fetch-depth: 0

      - name: Checkout release branch for publishing
        uses: actions/checkout@v7
        with:
          path: release
          ref: release
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set variables
        run: |
          echo "RELEASE_NAME=shadowrocket-$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
        shell: bash

      - name: Setup Python environment for Shadowrocket
        run: |
          cd code/shadowrocket
          python -m venv shadowrocket_env
          source shadowrocket_env/bin/activate
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update AI domain source
        run: |
          cd code || exit 1
          python scripts/update_ai_source.py

      - name: Build Shadowrocket rules
        run: |
          cd code/shadowrocket
          source shadowrocket_env/bin/activate
          echo "Building Shadowrocket rules via main script..."
          python build_shadowrocket_rules.py

      - name: Generate file checksums
        run: |
          cd code/shadowrocket/resultant
          for file in *.conf *.config *.list *.txt; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256sum"
            fi
          done
          # 为使用说明文件生成校验和（如果存在）
          if [ -f "../使用说明.md" ]; then
            sha256sum "../使用说明.md" > "shadowrocket-usage.md.sha256sum"
          fi
          if [ -f "../README.md" ]; then
            sha256sum "../README.md" > "shadowrocket-readme.md.sha256sum"
          fi

      - name: List generated files
        run: |
          cd code/shadowrocket/resultant
          echo "Generated Shadowrocket rule files:"
          ls -la *.conf *.config *.list *.txt *.sha256sum 2>/dev/null || echo "No files found"

      - name: Publish artifacts to release branch
        run: |
          set -euo pipefail
          # 配置 Git 用户信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "[DEBUG] 工作目录结构:"
          ls -la
          ls -la code/shadowrocket/resultant || true
          ls -la release || true

          # 准备目标目录
          mkdir -p release/shadowrocket/resultant

          # 从构建目录复制生成文件到发布目录
          echo "[DEBUG] 复制生成文件到 release/shadowrocket/resultant"
          cp -v code/shadowrocket/resultant/*.conf release/shadowrocket/resultant/ 2>/dev/null || true
          cp -v code/shadowrocket/resultant/*.config release/shadowrocket/resultant/ 2>/dev/null || true
          cp -v code/shadowrocket/resultant/*.list release/shadowrocket/resultant/ 2>/dev/null || true
          cp -v code/shadowrocket/resultant/*.sha256sum release/shadowrocket/resultant/ 2>/dev/null || true
          cp -v code/shadowrocket/resultant/*.txt release/shadowrocket/resultant/ 2>/dev/null || true
          # 复制使用说明及其校验（如果存在）
          if [ -f "code/shadowrocket/使用说明.md" ]; then
            cp -v code/shadowrocket/使用说明.md release/shadowrocket/使用说明.md
          fi
          if [ -f "code/shadowrocket/README.md" ]; then
            cp -v code/shadowrocket/README.md release/shadowrocket/README.md
          fi
          if [ -f "code/shadowrocket/resultant/shadowrocket-usage.md.sha256sum" ]; then
            cp -v code/shadowrocket/resultant/shadowrocket-usage.md.sha256sum release/shadowrocket/resultant/shadowrocket-usage.md.sha256sum
          fi
          if [ -f "code/shadowrocket/resultant/shadowrocket-readme.md.sha256sum" ]; then
            cp -v code/shadowrocket/resultant/shadowrocket-readme.md.sha256sum release/shadowrocket/resultant/shadowrocket-readme.md.sha256sum
          fi

          echo "[DEBUG] 列出准备提交的文件:"
          ls -la release/shadowrocket/resultant || true

          # 在 release 工作副本内提交并推送
          cd release
          # 其他工作流可能已强制更新 release 分支，先同步到最新状态
          git fetch origin release || true
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            git reset --hard origin/release
          fi
          
          # 重新确保目录存在（防止 reset 删除）并复制文件
          cd ..
          mkdir -p release/shadowrocket/resultant
          echo "[DEBUG] 重新复制生成文件到 release/shadowrocket/resultant"
          cp -v code/shadowrocket/resultant/*.conf release/shadowrocket/resultant/ 2>/dev/null || true
          cp -v code/shadowrocket/resultant/*.config release/shadowrocket/resultant/ 2>/dev/null || true
          cp -v code/shadowrocket/resultant/*.list release/shadowrocket/resultant/ 2>/dev/null || true
          cp -v code/shadowrocket/resultant/*.sha256sum release/shadowrocket/resultant/ 2>/dev/null || true
          cp -v code/shadowrocket/resultant/*.txt release/shadowrocket/resultant/ 2>/dev/null || true
          if [ -f "code/shadowrocket/使用说明.md" ]; then
            cp -v code/shadowrocket/使用说明.md release/shadowrocket/使用说明.md
          fi
          if [ -f "code/shadowrocket/README.md" ]; then
            cp -v code/shadowrocket/README.md release/shadowrocket/README.md
          fi
          if [ -f "code/shadowrocket/resultant/shadowrocket-usage.md.sha256sum" ]; then
            cp -v code/shadowrocket/resultant/shadowrocket-usage.md.sha256sum release/shadowrocket/resultant/shadowrocket-usage.md.sha256sum
          fi
          if [ -f "code/shadowrocket/resultant/shadowrocket-readme.md.sha256sum" ]; then
            cp -v code/shadowrocket/resultant/shadowrocket-readme.md.sha256sum release/shadowrocket/resultant/shadowrocket-readme.md.sha256sum
          fi
          
          cd release
          git add -A shadowrocket
          if git diff --staged --quiet; then
            echo "No changes to commit for Shadowrocket rules"
          else
            git commit -m "🚀 Auto-build Shadowrocket rules - ${{ env.BUILD_TIME }}"
            # 推送，如遇非快进失败则回退并重试
            if git push origin release; then
              echo "[INFO] Push succeeded"
            else
              echo "[WARN] Push rejected (non-fast-forward). Attempting rebase..."
              git pull --rebase origin release
              git push origin release
            fi
          fi

      - name: Create build summary
        run: |
          cd code/shadowrocket/resultant
          echo "## 🎯 Shadowrocket Rules Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** ${{ env.BUILD_TIME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Name:** ${{ env.RELEASE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Generated Files:" >> $GITHUB_STEP_SUMMARY
          for file in *.conf *.config *.list *.txt; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              echo "- **$file** (${size} bytes)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Usage Instructions:" >> $GITHUB_STEP_SUMMARY
          echo "Generated files are available in the \`release\` branch for direct import into Shadowrocket." >> $GITHUB_STEP_SUMMARY
